name: Chapter 6 Comparator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Percolation/**"
      - "audit/reviews/chapter-06/2026-07-10-c4286f9/comparator/**"
      - ".github/workflows/chapter6-comparator.yml"

permissions:
  contents: read

jobs:
  trusted-comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean and build trusted project imports
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Build pinned Landrun
        run: |
          go install github.com/zouuup/landrun/cmd/landrun@5ed4a3db3a4ad930d577215c6b9abaa19df7f99f

      - name: Build pinned Comparator for the project Lean version
        env:
          COMPARATOR_REV: 099775bf2e6073fcb22aacd3a2809fdeac3fc84a
        run: |
          git clone https://github.com/leanprover/comparator.git "$RUNNER_TEMP/comparator"
          git -C "$RUNNER_TEMP/comparator" checkout "$COMPARATOR_REV"
          printf '%s\n' 'leanprover/lean4:v4.30.0' > "$RUNNER_TEMP/comparator/lean-toolchain"
          lake -d "$RUNNER_TEMP/comparator" build lean4export comparator

      - name: Compare independently authored source statements with production solutions
        working-directory: audit/reviews/chapter-06/2026-07-10-c4286f9/comparator
        env:
          COMPARATOR_LANDRUN: /home/runner/go/bin/landrun
          COMPARATOR_LEAN4EXPORT: ${{ runner.temp }}/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export
          COMPARATOR_BIN: ${{ runner.temp }}/comparator/.lake/build/bin/comparator
        run: |
          systemd-run \
            --property=RestrictAddressFamilies=~AF_UNIX \
            --user --pty \
            -E PATH="$PATH" \
            -E COMPARATOR_LANDRUN="$COMPARATOR_LANDRUN" \
            -E COMPARATOR_LEAN4EXPORT="$COMPARATOR_LEAN4EXPORT" \
            --working-directory "$(pwd)" \
            -- bash -c 'lake env "$COMPARATOR_BIN" config.json'
